<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$page_title</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7f5;
      --surface: #ffffff;
      --ink: #182922;
      --muted: #53635b;
      --line: #ced8d0;
      --green: #12664b;
      --green-dark: #0b4532;
      --blue: #215f9b;
      --blue-wash: #e9f2fa;
      --red: #a73237;
      --wash: #e7f0eb;
      --warn: #fff0e5;
      --accent: #d97724;
      --grid: rgba(48, 79, 62, 0.035);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #171d19;
        --surface: #202923;
        --ink: #e8f0e9;
        --muted: #b0beb4;
        --line: #405246;
        --green: #8bd9ae;
        --green-dark: #56a579;
        --blue: #95c5f2;
        --blue-wash: #1b2e3e;
        --red: #ffabb0;
        --wash: #273b30;
        --warn: #3e2a25;
        --accent: #f09b53;
        --grid: rgba(201, 228, 207, 0.025);
      }
    }
    * { box-sizing: border-box; letter-spacing: 0; }
    body {
      margin: 0;
      background: linear-gradient(90deg, var(--grid) 1px, transparent 1px),
                  linear-gradient(var(--grid) 1px, transparent 1px), var(--paper);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
    }
    a { color: var(--blue); text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
    main { max-width: 1720px; margin: auto; padding: 32px 40px 64px; }
    header { border-top: 5px solid var(--green); padding: 24px 0 26px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .eyebrow { font: 600 12px/1.5 Consolas, monospace; color: var(--green); margin: 0 0 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .title-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 16px; }
    h1 { font-size: 32px; font-weight: 600; line-height: 1.25; margin: 0 0 10px; overflow-wrap: anywhere; }
    h2 { font-size: 22px; font-weight: 600; margin: 0 0 16px; line-height: 1.35; }
    h3 { font-size: 17px; margin: 0 0 10px; }
    p { margin: 0 0 12px; }
    .subtitle { max-width: 1200px; color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 16px; }
    .meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 28px; margin: 20px 0 0; }
    .meta-bar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
    dt { color: var(--muted); font-size: 12px; font-family: Consolas, monospace; }
    dd { margin: 3px 0 0; min-width: 0; overflow-wrap: anywhere; font-family: Consolas, monospace; font-size: 13px; font-weight: 500; }
    code, .mono, [data-mp-key^="target."], .status { font-family: Consolas, "Liberation Mono", monospace; font-size: 12px; overflow-wrap: anywhere; }
    .id { font: 600 12px/1.6 Consolas, monospace; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; font-weight: 600; font-family: Consolas, monospace; }
    .badge-wait { background: var(--warn); color: var(--accent); border: 1px solid var(--accent); }
    .badge-live { background: var(--wash); color: var(--green); border: 1px solid var(--green); }

    /* Four-Dimensional Architecture: 1 Order -> 2 Event -> 3 Trace -> 4 Name */
    .four-layers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-bottom: 24px; }
    .layer-card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; }
    .layer-card.c1, .layer-card.card-order, .layer-card.l3b { border-top-color: var(--red); }
    .layer-card.c2, .layer-card.card-event, .layer-card.l2 { border-top-color: var(--blue); }
    .layer-card.c3, .layer-card.card-trace, .layer-card.l3a { border-top-color: var(--accent); }
    .layer-card.c4, .layer-card.card-name, .layer-card.l1 { border-top-color: var(--green); }
    .layer-title { font-size: 17px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
    .layer-tag { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
    .layer-desc { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
    .layer-list { list-style: none; padding: 0; margin: 0; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
    .layer-list li { padding: 6px 10px; background: var(--paper); border-radius: 4px; border-left: 3px solid var(--line); }
    .layer-card.c1 .layer-list li, .layer-card.card-order .layer-list li, .layer-card.l3b .layer-list li { border-left-color: var(--red); }
    .layer-card.c2 .layer-list li, .layer-card.card-event .layer-list li, .layer-card.l2 .layer-list li { border-left-color: var(--blue); }
    .layer-card.c3 .layer-list li, .layer-card.card-trace .layer-list li, .layer-card.l3a .layer-list li { border-left-color: var(--accent); }
    .layer-card.c4 .layer-list li, .layer-card.card-name .layer-list li, .layer-card.l1 .layer-list li { border-left-color: var(--green); }

    /* Tactical Work Map & WIP Grid */
    .tactical-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; }
    .panel-header { font-size: 18px; font-weight: 600; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    tr.active-row { background: var(--warn); }
    .gate-list { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    .gate-step { padding: 10px 14px; border-radius: 4px; background: var(--paper); border-left: 3px solid var(--blue); }
    .gate-step strong { display: block; margin-bottom: 4px; color: var(--blue); }

    /* Generic Bands */
    .band { padding: 28px 0; border-bottom: 1px solid var(--line); }
    .number { color: var(--green); font: 600 13px/1.5 Consolas, monospace; margin-right: 12px; }
    .checks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; padding: 0; margin: 20px 0 0; list-style: none; }
    .checks li { border-left: 3px solid var(--line); padding: 6px 14px; min-width: 0; }
    .checks .pass { border-left-color: var(--green); }
    .checks .issues_found { border-left-color: var(--red); }
    .checks strong { display: block; font-size: 14px; font-weight: 500; }
    .checks span { display: block; margin-top: 4px; color: var(--muted); }
    .domains { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; margin: 20px 0 0; }
    .domain { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--green); border-radius: 4px; padding: 14px 16px; min-height: 110px; min-width: 0; }
    .domain:nth-child(3n+2) { border-top-color: var(--blue); }
    .domain:nth-child(3n) { border-top-color: #b66a22; }
    .domain strong { display: block; font-size: 18px; font-weight: 600; }
    .domain small { color: var(--muted); display: block; margin-top: 6px; }
    .scope { color: var(--muted); margin: 14px 0 0; font-size: 13px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; }
    .two-col > * { min-width: 0; }
    ul { margin: 0; padding-left: 1.2rem; }
    li { margin: 6px 0; overflow-wrap: anywhere; }
    .decision { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 18px 32px; }
    .decision .wide { grid-column: 1/-1; }
    .decision strong { display: block; color: var(--green); font-size: 13px; margin-bottom: 6px; }
    .callout { border-left: 4px solid var(--red); background: var(--warn); padding: 16px 22px; margin-top: 20px; }
    .callout h3 { color: var(--red); }
    .table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.55; }
    th { background: var(--wash); text-align: left; font-size: 12px; font-weight: 600; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    .lexicon { min-width: 1080px; }
    .lexicon .name { width: 32%; }
    .lexicon .key { width: 8%; }
    .name strong { display: block; font-size: 16px; font-weight: 600; }
    .name .cn { display: block; color: var(--muted); margin: 4px 0 8px; }
    .binding-detail { margin: 8px 0; }
    .binding-detail dt { font-size: 11px; }
    .binding-detail dd { font-size: 12px; white-space: pre-wrap; }
    .source-link { font-family: Consolas, monospace; font-size: 11px; }
    details > summary { cursor: pointer; color: var(--blue); padding: 6px 0; }
    .lexicon-panel > summary { margin-bottom: 12px; }
    .empty { color: var(--muted); font-size: 14px; }
    .findings { min-width: 720px; }
    .findings .actual { color: var(--red); }
    .sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 32px; margin: 0; }
    .source-item { padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
    .source-item dd { font: 11px/1.7 Consolas, monospace; }
    .delta { color: var(--muted); font-size: 13px; margin-top: 16px; overflow-wrap: anywhere; }
    .table-wrap.scrollable { max-height: 480px; overflow-y: auto; }
    .panel-body { overflow-y: auto; max-height: 520px; }
    .sub-panel { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
    .sub-panel h4 { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
    footer { padding-top: 24px; font-size: 12px; color: var(--muted); }
    @media (max-width: 1200px) { .domains { grid-template-columns: repeat(4, minmax(0, 1fr)); } .four-layers { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tactical-grid { grid-template-columns: 1fr; } }
    @media (max-width: 720px) {
      main { padding: 24px 18px 40px; }
      .meta, .meta-bar, .checks, .domains { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .four-layers, .two-col, .decision, .sources { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) { .meta { grid-template-columns: 1fr; } }
    @media print { body { background: white; } main { max-width: none; padding: 0; } details { display: block; } .table-wrap { overflow: visible; } }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">TeamPage · MPS · Mirror Page · non-authority / no-writeback</div>
    $header
    $checks
    $failures
    $overview
  </header>
  $four_layers
  $tactical_grid
  <footer>$footer</footer>
</main>
</body>
</html>
